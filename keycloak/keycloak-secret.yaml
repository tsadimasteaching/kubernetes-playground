# Credentials of Keycloak: the first admin user and the user of Keycloak's own database.
# Referenced by keycloak-deployment.yaml and keycloak-postgres.yaml with valueFrom.secretKeyRef.
#
# stringData takes plain text; Kubernetes stores it base64-encoded under .data.
# base64 is NOT encryption: anyone who can read Secrets can read these values
#   kubectl get secret keycloak-secrets -o jsonpath='{.data.admin-password}' | base64 -d
# Change the passwords before using this anywhere but a local playground, and do not commit real ones.
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secrets
  labels:
    app: keycloak
type: Opaque
stringData:
  # Temporary admin of the "master" realm, created on the FIRST start only (empty database).
  # Changing it later has no effect: change the password in the admin console instead.
  admin-username: admin
  admin-password: admin
  # User and password of the keycloak-postgres database. Also applied on the first start only.
  db-username: keycloak
  db-password: keycloak-db-pass
