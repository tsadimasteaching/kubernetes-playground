# Let's Encrypt (staging) ClusterIssuer — ONLY for clusters reachable from the internet
# with a real DNS name pointing at the Traefik LoadBalancer. It does NOT work on minikube.
# Replace the email, test with staging, then switch the server to production:
#   https://acme-v02.api.letsencrypt.org/directory
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: you@example.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
