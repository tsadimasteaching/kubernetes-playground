apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vue-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: vue.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vue-svc
                port:
                  name: vue
