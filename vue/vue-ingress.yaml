# HTTP Ingress for the Vue frontend, served by Traefik (see README → "Install the Traefik ingress controller").
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vue-ingress
  annotations:
    # Traefik entrypoint "web" = port 80 (HTTP)
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: vue.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vue-svc
                port:
                  name: vue
