# Vue frontend of the Tickets app (source and Dockerfile in ../frontend).
# nginx serves the static files and proxies /api/* to the Spring backend.
apiVersion: apps/v1
kind: Deployment
metadata:
  name:  vue-deployment
  namespace: default
  labels:
    app: vue
spec:
  selector:
    matchLabels:
      app: vue
  replicas: 1
  template:
    metadata:
      labels:
        app: vue
    spec:
      containers:
      - name:  vue
        # Built from frontend/Dockerfile.multistage
        image:  ghcr.io/tsadimas/cp-vue:2026
        env:
        # Where nginx forwards /api/* (frontend/nginx/default.conf.template).
        # "spring" is the backend Service, so it must exist before this pod starts.
        - name: BACKEND_URL
          value: http://spring:8080
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 20
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 128Mi
        ports:
        # nginx-unprivileged runs as non-root, so it listens on 8080, not 80
        - containerPort: 8080
          name:  vue
      imagePullSecrets:
      - name: registry-credentials
