spring.application.name=tickets
server.port=8080

# ---- PostgreSQL --------------------------------------------------------------
# Defaults work for a Postgres container published on localhost:5432.
# In Docker, override them with environment variables, e.g.
#   -e DB_HOST=tickets-db   (the Postgres container name on the same network)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tickets}
spring.datasource.username=${DB_USER:tickets}
spring.datasource.password=${DB_PASSWORD:tickets}

# Hibernate creates/updates the tables from the @Entity classes (playground only;
# use Flyway/Liquibase migrations in real projects).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- Swagger / OpenAPI --------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# ---- Actuator -----------------------------------------------------------------
# health is used by the Docker HEALTHCHECK (and later by Kubernetes probes)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Shut down cleanly when Docker sends SIGTERM (`docker stop`).
server.shutdown=graceful
