spring.application.name=tickets
server.port=8080

# ---- PostgreSQL --------------------------------------------------------------
# Defaults work for a Postgres container published on localhost:5432.
# In Docker, override them with environment variables, e.g.
#   -e DB_HOST=tickets-db   (the Postgres container name on the same network)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tickets}
spring.datasource.username=${DB_USER:tickets}
spring.datasource.password=${DB_PASSWORD:tickets}

# Hibernate creates/updates the tables from the @Entity classes (playground only;
# use Flyway/Liquibase migrations in real projects).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- Keycloak (OAuth2 resource server) ----------------------------------------
# The API accepts only JWT access tokens issued by the Keycloak realm "tickets".
#
# issuer-uri  : must be EXACTLY the "iss" claim of the tokens, i.e. the Keycloak URL that the
#               BROWSER used to log in (Keycloak writes the URL it was called with into "iss").
# jwk-set-uri : where Spring downloads Keycloak's public keys to check the token signature.
#               Inside Kubernetes this is the internal Service (http://keycloak:8080/...), which
#               differs from the public issuer URL. Setting it also means Spring does NOT need to
#               reach the issuer URL at all, and that Spring starts even when Keycloak is down
#               (the keys are fetched on the first request).
# audiences   : the token's "aud" claim must contain this value (added by a Keycloak mapper).
#
# Defaults = Keycloak started locally with Docker on port 8180 (see Keycloak.md).
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/tickets}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.audiences=${KEYCLOAK_AUDIENCE:tickets-backend}

# ---- Swagger / OpenAPI --------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# ---- Actuator -----------------------------------------------------------------
# health is used by the Docker HEALTHCHECK (and later by Kubernetes probes)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Shut down cleanly when Docker sends SIGTERM (`docker stop`).
server.shutdown=graceful
