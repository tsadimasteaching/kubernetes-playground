# Tests use an in-memory H2 database instead of PostgreSQL.
spring.datasource.url=jdbc:h2:mem:tickets;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Tests build their tokens in memory (see TicketControllerTest), so Keycloak is never contacted.
# A JWK set URI is still needed for Spring Boot to create the JwtDecoder bean.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:0/not-used-by-tests
